name: Build Positron remote server for macOS

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Positron commit to build (must match the installed Positron app)
        required: true
        default: 467ff390dd8b4ffc8972ebb84d9e05a1fd5a4fe2
      build_number:
        description: Positron build number of that release
        required: true
        default: "2"

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  POSITRON_BUILD_NUMBER: ${{ inputs.build_number }}
  BUILD_SOURCEVERSION: ${{ inputs.commit }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  MANGLER_WORKER_POOL_SIZE: 1

jobs:
  # The TypeScript compile of src/ (gulp task compile-build-without-mangling)
  # needs more than 8 GB of JavaScript heap. The macOS arm64 runner has only
  # 7 GB of RAM and runs out of memory there, so this platform-independent step
  # runs on a Linux runner (16 GB RAM, plus extra swap) and hands its output
  # (out-build/) to the macOS job.
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      npm_config_arch: x64
    steps:
      - name: Add swap space
        run: |
          sudo fallocate -l 12G /swapfile-extra
          sudo chmod 600 /swapfile-extra
          sudo mkswap /swapfile-extra
          sudo swapon /swapfile-extra
          free -h

      # Headers that native modules (kerberos, keytar, native-keymap, ...)
      # need to compile during `npm ci` on Linux.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libsecret-1-dev libx11-dev libxkbfile-dev

      - name: Check out Positron at the requested commit
        uses: actions/checkout@v4
        with:
          repository: posit-dev/positron
          ref: ${{ inputs.commit }}
          path: positron
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version-file: positron/.nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: positron
        run: |
          npm install --prefix build --fetch-timeout 120000
          npm ci --fetch-timeout 120000

      - name: Compile src (without mangling)
        working-directory: positron
        # Same as `npm run gulp`, but with a larger heap than the script's 8 GB.
        run: node --experimental-strip-types --max-old-space-size=12288 ./node_modules/gulp/bin/gulp.js compile-build-without-mangling

      - name: Archive out-build
        working-directory: positron
        run: tar -czf ../out-build.tar.gz out-build

      - uses: actions/upload-artifact@v4
        with:
          name: out-build
          path: out-build.tar.gz
          retention-days: 1

  build:
    needs: compile
    runs-on: macos-15
    timeout-minutes: 150
    env:
      npm_config_arch: arm64
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: notices

      - name: Check out Positron at the requested commit
        uses: actions/checkout@v4
        with:
          repository: posit-dev/positron
          ref: ${{ inputs.commit }}
          path: positron
          submodules: recursive

      - name: Fetch ark submodule history and tags
        working-directory: positron/extensions/positron-r/ark
        run: git fetch --unshallow --tags || git fetch --tags

      # Patch ark so its DAP, LSP and help proxy listeners only accept
      # connections from processes of the same user (see README.md and
      # SECURITY-NOTE.md). Positron's install script copies a local
      # `target/release/ark` build in place of the prebuilt binary.
      - name: Apply the ark peer-check patch
        working-directory: positron/extensions/positron-r/ark
        run: |
          git apply --verbose "$GITHUB_WORKSPACE/notices/patches/ark-peer-check.patch"
          git status --short

      - name: Test the ark peer check
        working-directory: positron/extensions/positron-r/ark
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ark-test-target
        run: |
          cargo test -p ark --lib peer_check -- --test-threads=1
          cargo test -p ark --lib help_proxy -- --test-threads=1

          T="$RUNNER_TEMP/peer-check"
          mkdir -p "$T"
          chmod 755 "$T"
          wait_for_port() {
            for _ in $(seq 1 300); do [ -s "$1" ] && return 0; sleep 1; done
            echo "No port in $1"; return 1
          }

          # DAP/LSP-style listener: a real connection from another process
          # must be accepted from the same user and rejected from `nobody`.
          for case in accept:runner reject:nobody; do
            expect=${case%%:*}; user=${case##*:}
            rm -f "$T/port"
            ARK_PEER_CHECK_LISTEN_FILE="$T/port" ARK_PEER_CHECK_EXPECT=$expect \
              cargo test -p ark --lib peer_check::tests::test_peer_from_env -- --exact --nocapture &
            test_pid=$!
            wait_for_port "$T/port"
            as=(); [ "$user" = nobody ] && as=(sudo -u nobody)
            "${as[@]}" perl -MIO::Socket::INET -e \
              '$s = IO::Socket::INET->new(PeerAddr => "127.0.0.1", PeerPort => $ARGV[0]) or die "connect: $!"; sleep 10' \
              "$(cat "$T/port")" &
            wait "$test_pid"
            echo "Connection from $user: ${expect}ed as expected"
          done

          # Help proxy: a file readable by both users is served to the same
          # user and refused (403) to `nobody`.
          echo "peer check" > "$T/probe.txt"
          chmod 644 "$T/probe.txt"
          rm -f "$T/port" "$T/port.done"
          ARK_HELP_PROXY_PORT_FILE="$T/port" \
            cargo test -p ark --lib help_proxy::tests::test_help_proxy_from_env -- --exact &
          test_pid=$!
          wait_for_port "$T/port"
          url="http://127.0.0.1:$(cat "$T/port")/dev-figure?file=$T/probe.txt"
          same=$(curl -s --noproxy '*' -o /dev/null -w '%{http_code}' "$url")
          other=$(sudo -u nobody curl -s --noproxy '*' -o /dev/null -w '%{http_code}' "$url")
          touch "$T/port.done"
          wait "$test_pid"
          echo "Help proxy: same user $same, nobody $other"
          [ "$same" = 200 ] && [ "$other" = 403 ]

      - name: Build the patched ark
        working-directory: positron/extensions/positron-r/ark
        run: |
          # Report the same version as the prebuild for this commit
          # (`<version>+<distance>.<sha>`), as Positron's install script does.
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/ark/Cargo.toml | head -1)
          distance=$(git rev-list --count "$(git describe --tags --abbrev=0)"..HEAD)
          export ARK_BUILD_VERSION="$version+$distance"
          cargo build --release -p ark --bin ark
          codesign --force --sign - target/release/ark
          file target/release/ark
          target/release/ark --version

      - uses: actions/setup-node@v4
        with:
          node-version-file: positron/.nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: positron
        run: |
          npm install --prefix build --fetch-timeout 120000
          npm ci --fetch-timeout 120000

      - uses: actions/download-artifact@v4
        with:
          name: out-build

      - name: Restore out-build
        run: tar -xzf out-build.tar.gz -C positron

      # The remaining steps of Positron's `vscode-reh-darwin-arm64-min` task
      # (build/gulpfile.reh.ts), each in its own process to keep memory low.
      # The unregistered `clean-extensions-build` task is a plain rm here.
      # `copy-extension-binaries` cannot run as a gulp task on its own: it does
      # not wait for its copy streams, so gulp reports "did not complete". Call
      # the same Positron function directly; Node exits once the copies finish.
      - name: Build extensions
        working-directory: positron
        run: |
          rm -rf .build/extensions
          npm run gulp compile-non-native-extensions-build
          npm run gulp compile-copilot-extension-build
          npm run gulp compile-extension-media-build
          node --experimental-strip-types --input-type=module -e "const ext = await import('./build/lib/extensions.ts'); await ext.copyExtensionBinaries('.build/extensions');"
          echo "Copied extension binaries:"
          find .build/extensions -type f -perm -u+x \( -name 'ark' -o -name 'kcserver' -o -name 'pet' \) -print

      - name: Bundle and minify the server
        working-directory: positron
        run: npm run gulp minify-vscode-reh

      - name: Package the server for darwin-arm64
        working-directory: positron
        run: npm run gulp vscode-reh-darwin-arm64-min-ci

      - name: Package with license and notices
        run: |
          OUT=vscode-reh-darwin-arm64
          ARK="$OUT/extensions/positron-r/resources/ark/ark"
          # The server must ship the patched ark built above.
          cmp positron/extensions/positron-r/ark/target/release/ark "$ARK"
          codesign --force --sign - "$ARK"
          codesign --verify --verbose "$ARK"
          "$ARK" --version
          mkdir -p "$OUT/licenses/ark"
          cp positron/extensions/positron-r/ark/LICENSE* "$OUT/licenses/ark/"
          cp notices/patches/ark-peer-check.patch "$OUT/licenses/ark/"
          cp positron/LICENSE.txt "$OUT/LICENSE.txt"
          cp notices/README.md "$OUT/BUILD-NOTICE.md"
          tar -czf positron-reh-darwin-arm64-${{ inputs.commit }}.tar.gz "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: positron-reh-darwin-arm64-${{ inputs.commit }}
          path: positron-reh-darwin-arm64-*.tar.gz
          retention-days: 30
