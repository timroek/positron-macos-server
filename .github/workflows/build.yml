name: Build Positron remote server for macOS

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Positron commit to build (must match the installed Positron app)
        required: true
        default: 467ff390dd8b4ffc8972ebb84d9e05a1fd5a4fe2
      build_number:
        description: Positron build number of that release
        required: true
        default: "2"

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  POSITRON_BUILD_NUMBER: ${{ inputs.build_number }}
  BUILD_SOURCEVERSION: ${{ inputs.commit }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  MANGLER_WORKER_POOL_SIZE: 1

jobs:
  # The TypeScript compile of src/ (gulp task compile-build-without-mangling)
  # needs more than 8 GB of JavaScript heap. The macOS arm64 runner has only
  # 7 GB of RAM and runs out of memory there, so this platform-independent step
  # runs on a Linux runner (16 GB RAM, plus extra swap) and hands its output
  # (out-build/) to the macOS job.
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      npm_config_arch: x64
    steps:
      - name: Add swap space
        run: |
          sudo fallocate -l 12G /swapfile-extra
          sudo chmod 600 /swapfile-extra
          sudo mkswap /swapfile-extra
          sudo swapon /swapfile-extra
          free -h

      # Headers that native modules (kerberos, keytar, native-keymap, ...)
      # need to compile during `npm ci` on Linux.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libsecret-1-dev libx11-dev libxkbfile-dev

      - name: Check out Positron at the requested commit
        uses: actions/checkout@v4
        with:
          repository: posit-dev/positron
          ref: ${{ inputs.commit }}
          path: positron
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version-file: positron/.nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: positron
        run: |
          npm install --prefix build --fetch-timeout 120000
          npm ci --fetch-timeout 120000

      - name: Compile src (without mangling)
        working-directory: positron
        # Same as `npm run gulp`, but with a larger heap than the script's 8 GB.
        run: node --experimental-strip-types --max-old-space-size=12288 ./node_modules/gulp/bin/gulp.js compile-build-without-mangling

      - name: Archive out-build
        working-directory: positron
        run: tar -czf ../out-build.tar.gz out-build

      - uses: actions/upload-artifact@v4
        with:
          name: out-build
          path: out-build.tar.gz
          retention-days: 1

  build:
    needs: compile
    runs-on: macos-15
    timeout-minutes: 150
    env:
      npm_config_arch: arm64
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: notices

      - name: Check out Positron at the requested commit
        uses: actions/checkout@v4
        with:
          repository: posit-dev/positron
          ref: ${{ inputs.commit }}
          path: positron
          submodules: recursive

      - name: Fetch ark submodule history and tags
        working-directory: positron/extensions/positron-r/ark
        run: git fetch --unshallow --tags || git fetch --tags

      - uses: actions/setup-node@v4
        with:
          node-version-file: positron/.nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: positron
        run: |
          npm install --prefix build --fetch-timeout 120000
          npm ci --fetch-timeout 120000

      - uses: actions/download-artifact@v4
        with:
          name: out-build

      - name: Restore out-build
        run: tar -xzf out-build.tar.gz -C positron

      # The remaining steps of Positron's `vscode-reh-darwin-arm64-min` task
      # (build/gulpfile.reh.ts), each in its own process to keep memory low.
      # The unregistered `clean-extensions-build` task is a plain rm here.
      # `copy-extension-binaries` cannot run as a gulp task on its own: it does
      # not wait for its copy streams, so gulp reports "did not complete". Call
      # the same Positron function directly; Node exits once the copies finish.
      - name: Build extensions
        working-directory: positron
        run: |
          rm -rf .build/extensions
          npm run gulp compile-non-native-extensions-build
          npm run gulp compile-copilot-extension-build
          npm run gulp compile-extension-media-build
          node --experimental-strip-types --input-type=module -e "const ext = await import('./build/lib/extensions.ts'); await ext.copyExtensionBinaries('.build/extensions');"
          echo "Copied extension binaries:"
          find .build/extensions -type f -perm -u+x \( -name 'ark' -o -name 'kcserver' -o -name 'pet' \) -print

      - name: Bundle and minify the server
        working-directory: positron
        run: npm run gulp minify-vscode-reh

      - name: Package the server for darwin-arm64
        working-directory: positron
        run: npm run gulp vscode-reh-darwin-arm64-min-ci

      - name: Package with license and notices
        run: |
          OUT=vscode-reh-darwin-arm64
          cp positron/LICENSE.txt "$OUT/LICENSE.txt"
          cp notices/README.md "$OUT/BUILD-NOTICE.md"
          tar -czf positron-reh-darwin-arm64-${{ inputs.commit }}.tar.gz "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: positron-reh-darwin-arm64-${{ inputs.commit }}
          path: positron-reh-darwin-arm64-*.tar.gz
          retention-days: 30
